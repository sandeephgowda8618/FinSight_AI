components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: finsight_session
      description: Illustrative cookie name only. Match the actual current session cookie; HttpOnly, Secure and SameSite settings
        are mandatory in deployed HTTPS environments.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: Use only if selected deployment policy uses bearer credentials; never store tokens in ordinary logs.
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: object
          additionalProperties: true
        request_id:
          type: string
        correlation_id:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            details:
              type: object
              additionalProperties: true
        request_id:
          type: string
        correlation_id:
          type: string
    PageInfo:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 100
    AsyncAccepted:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          format: uuid
        run_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
        request_id:
          type: string
  responses:
    Conflict:
      description: Version/state/idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed request or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired or revoked session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not accessible, according to anti-enumeration policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Schema/field validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure; no stack trace or secret content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required dependency unavailable; sensitive authorization checks fail closed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
